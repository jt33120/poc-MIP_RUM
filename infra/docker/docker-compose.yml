# Backend MIP RUM auto-hébergé — les CINQ services Railway, sur un poste ou un
# serveur, avec leurs images de production (`services/<x>/Dockerfile`).
#
#   db (Postgres 17) ◀── migrate (one-shot) ◀── collector   (profil `collector`)
#                                            ◀── scheduler   (profil `scheduler`)
#                                            ◀── notifier    (profil `notifier`)
#                                            ◀── api         (profil `api`)
#   mcp (profil `mcp`) ──▶ API v1 de la console — jamais la base
#
# UN PROFIL PAR SERVICE. `db` et `migrate` n'en ont pas : ils suivent tout
# service qui les demande. Un service se démarre seul, avec ce dont il dépend :
#
#   docker compose run --rm migrate                     la base de dev, migrée
#   docker compose up -d --build --wait collector       + le collecteur
#   docker compose --profile tout up -d --build --wait  les cinq services
#
# SCHEDULER ET NOTIFIER ENSEMBLE (`tout`) : poser SCHEDULER_DELIVERY=off. Sinon
# le scheduler livre aussi, sans clé Resend, et solde les e-mails `skipped`.
#
# LE SCHÉMA EST POSÉ PAR LE MIGRATEUR DE PRODUCTION, plus par un script
# d'initialisation de Postgres. `initdb.sh` appliquait schema.sql puis chaque
# migration par psql, dans l'ordre lexical : il prouvait que les FICHIERS
# s'enchaînent, rien du programme qui les applique réellement au
# pré-déploiement du scheduler — registre `schema_migration`, transaction par
# fichier, index de pré-déploiement. Pire, une base montée par lui n'avait pas
# de registre : sans étalonnage (`--baseline`), le premier passage du vrai
# migrateur y aurait tout rejoué (en-tête de `@mip/db/migrate.mjs`). `migrate`
# lance ici la commande exacte du pré-déploiement Railway
# (`node services/scheduler/migrate.mjs`), avec l'image du scheduler ; les
# autres services ne démarrent qu'après sa sortie EN SUCCÈS. C'est l'ordre que
# Railway donne au scheduler — et que ce fichier donne aux autres services.
#
# C'EST AUSSI LA BASE DE DÉVELOPPEMENT (README, « Démarrage local » ; l'E2E) :
# `run --rm migrate`, puis `postgres://postgres:postgres@localhost:5433/mip_rum`.
# `run`, et non `up --wait db migrate` : `--wait` rend la main dès que
# `migrate` DÉMARRE (sans sonde, un conteneur qui tourne passe pour sain) ;
# `run` attend sa sortie et rend son code — constaté en construisant ce fichier.
#
# Les images de service sont épinglées par digest dans leur Dockerfile ;
# `postgres:17` suit la majeure de production (Neon 17) comme la CI.
name: mip-rum-backend

x-logging: &jsonlog
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# La chaîne de connexion des services qui parlent à la base, par le réseau du
# compose (`db:5432`, pas le port publié sur l'hôte).
x-db-url: &db-url postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mip_rum}

# Démarrer APRÈS une migration réussie. `service_completed_successfully` : un
# migrateur en échec (code ≠ 0) bloque le démarrage, exactement comme un
# pré-déploiement en échec garde l'ancien déploiement en service sur Railway.
x-apres-migration: &apres-migration
  migrate:
    condition: service_completed_successfully

services:
  db:
    # 17, comme la production (Neon 17.11) et la CI. Un volume `db-data`
    # initialisé par une version antérieure ne démarre PAS sous 17 (format de
    # répertoire incompatible) : `docker compose down -v` puis `up` le recrée.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mip_rum}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      # -h localhost force le TCP : pendant l'initialisation du volume, Postgres
      # n'écoute que sur le socket.
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *jsonlog

  migrate:
    # L'image du SCHEDULER : le migrateur est son outil (seul le scheduler
    # migre, contrat de service § 8), il n'est embarqué nulle part ailleurs.
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    image: mip-rum/scheduler:local
    command: ["node", "services/scheduler/migrate.mjs"]
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    # One-shot : il applique ce qui manque, le dit (« migrations à jour »), et
    # sort. Rejoué à chaque `up`, il n'a rien à faire la seconde fois.
    restart: "no"
    # La sonde de l'image vise le WORKER ; ce conteneur n'écoute rien.
    healthcheck:
      disable: true
    logging: *jsonlog

  collector:
    profiles: ["collector", "tout"]
    build:
      context: ../..
      dockerfile: services/collector/Dockerfile
    image: mip-rum/collector:local
    environment:
      DATABASE_URL: *db-url
      # true = rejeter (403) tout app_id inconnu/sans clé. false (défaut POC) =
      # fail-open. À passer true une fois toutes les apps porteuses d'une clé.
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDENTITY_HASH_SECRET: ${IDENTITY_HASH_SECRET:-}
      # Obligatoire avec le secret (sinon refus de démarrer) ; calcul :
      # printf %s "$IDENTITY_HASH_SECRET" | node scripts/ops/empreinte-identite.mjs
      IDENTITY_HASH_FINGERPRINT: ${IDENTITY_HASH_FINGERPRINT:-}
      # Jeton de /ready et /metrics (≥ 32 caractères). Vide : les deux → 404.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Secret du relais de la console (bord de confiance). Vide : tout le
      # trafic est direct, et un en-tête x-mip-edge-* est retiré sans effet.
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:-}
      # GeoIP : la base est DANS l'image ; sans source d'adresse déclarée, elle
      # reste inerte (`none`). `socket` derrière aucun proxy, `xff:<n>` derrière n.
      GEOIP_IP_SOURCE: ${GEOIP_IP_SOURCE:-none}
    depends_on: *apres-migration
    ports:
      - "${COLLECTOR_PORT:-4318}:4318"
    # La sonde vient de l'image (HEALTHCHECK sur /health) : une seule définition.
    restart: unless-stopped
    logging: *jsonlog

  scheduler:
    profiles: ["scheduler", "tout"]
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    image: mip-rum/scheduler:local
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Jeton de /ready et /metrics (≥ 32 caractères). Vide : les deux répondent
      # 404 — `/health`, la sonde de l'image, n'en dépend pas.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Dead-man's switch (https) : vide en local, aucun signal ne part.
      DEADMAN_URL: ${DEADMAN_URL:-}
      # `off` quand le notifier tourne aussi (voir l'en-tête).
      SCHEDULER_DELIVERY: ${SCHEDULER_DELIVERY:-on}
    depends_on: *apres-migration
    ports:
      # /health (processus + base), /ready et /metrics (fraîcheur, arriéré ; jeton).
      - "${SCHEDULER_PORT:-4320}:8080"
    restart: unless-stopped
    logging: *jsonlog

  notifier:
    profiles: ["notifier", "tout"]
    build:
      context: ../..
      dockerfile: services/notifier/Dockerfile
    image: mip-rum/notifier:local
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Jeton de /ready et /metrics (≥ 32 caractères). Vide : les deux → 404.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      NOTIFIER_INTERVAL_MS: ${NOTIFIER_INTERVAL_MS:-15000}
      # Vides en local : les e-mails sont soldés `skipped` avec la raison, les
      # webhooks partent avec leur seul identifiant de livraison.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TEST_RECIPIENTS: ${ALERT_EMAIL_TEST_RECIPIENTS:-}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
      TICKET_SECRET_KEY: ${TICKET_SECRET_KEY:-}
    depends_on: *apres-migration
    ports:
      # /health (processus + base), /ready et /metrics (fraîcheur, arriéré ; jeton).
      - "${NOTIFIER_PORT:-4321}:8080"
    restart: unless-stopped
    logging: *jsonlog

  api:
    profiles: ["api", "tout"]
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    image: mip-rum/api:local
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Jetons machine (`jeton` ou `jeton@app1;app2`), la MÊME valeur que la
      # console. Vide : seuls les jetons en base (écran Jetons de lecture) valent.
      CONSOLE_API_TOKENS: ${CONSOLE_API_TOKENS:-}
      CONSOLE_API_ALLOWED_ORIGINS: ${CONSOLE_API_ALLOWED_ORIGINS:-}
    depends_on: *apres-migration
    ports:
      # /api/v1/* (lecture seule), /health, /live ; /ready et /metrics sous jeton.
      - "${API_PORT:-4323}:8080"
    restart: unless-stopped
    logging: *jsonlog

  console-api:
    profiles: ["console-api", "tout"]
    build:
      context: ../..
      dockerfile: services/console-api/Dockerfile
    image: mip-rum/console-api:local
    environment:
      DATABASE_URL: *db-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # OBLIGATOIRES, et sans valeur par défaut : un secret n'a pas de valeur « de
      # développement » dans un fichier versionné. Vides, le service refuse de
      # démarrer et dit laquelle manque (infra/docker/README.md, « console-api »).
      CONSOLE_API_CLIENT_SECRETS: ${CONSOLE_API_CLIENT_SECRETS:-}
      SESSION_SIGNING_KEYS: ${SESSION_SIGNING_KEYS:-}
      # Le MÊME secret que le collector (plus haut) : les commandes RGPD par
      # identité hachent la valeur saisie avec lui. Vide : elles rendent
      # « indisponible », le reste du service fonctionne.
      IDENTITY_HASH_SECRET: ${IDENTITY_HASH_SECRET:-}
    depends_on: *apres-migration
    ports:
      # /v1/* sous secret client (x-mip-client) ; /health et /live publics ;
      # /ready et /metrics sous jeton.
      - "${CONSOLE_API_PORT:-4324}:8080"
    restart: unless-stopped
    logging: *jsonlog

  mcp:
    profiles: ["mcp", "tout"]
    build:
      context: ../..
      dockerfile: services/mcp/Dockerfile
    image: mip-rum/mcp:local
    # NI DATABASE_URL NI DÉPENDANCE À `migrate` : ce service n'atteint pas la
    # base, et le faire attendre une migration lui donnerait un lien avec elle
    # qu'il ne doit pas avoir. Il ne parle qu'à l'API v1 : celle du service
    # `api` si MIP_API_HOST est posé (réseau privé, comme sur Railway :
    # `MIP_API_HOST=api MIP_API_PORT=8080` avec le profil `api`), sinon la console.
    environment:
      MIP_API_HOST: ${MIP_API_HOST:-}
      MIP_API_PORT: ${MIP_API_PORT:-8080}
      # La console du poste par défaut (`pnpm dev` sur :3000), vue depuis le
      # conteneur. Un appel d'outil sans console joignable échoue proprement ;
      # le service, lui, démarre et répond à `tools/list`.
      MIP_CONSOLE_URL: ${MIP_CONSOLE_URL:-http://host.docker.internal:3000}
      MCP_PATH: ${MCP_PATH:-/mcp}
    extra_hosts:
      # `host.docker.internal` existe d'office sous Docker Desktop, pas sous Linux.
      - "host.docker.internal:host-gateway"
    ports:
      - "${MCP_PORT:-4322}:8080"
    restart: unless-stopped
    logging: *jsonlog

volumes:
  db-data:
