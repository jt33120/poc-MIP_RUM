# Déclencheur des tâches planifiées fréquentes (alertes, SLO, uptime, livraison
# des webhooks, rollups).
#
# POURQUOI ICI ET PAS SUR VERCEL. Les jobs tournaient sous `pg_cron` ; ni
# `pg_cron` ni `pg_net` ne sont utilisables sur Neon (cf. docs/NEON_MIGRATION.md
# §3.3-3.4). Le relais naturel était Vercel Cron — mais le plan **Hobby n'accepte
# QUE des crons quotidiens** : déclarer `*/5 * * * *` fait échouer le déploiement
# entier. Seul `/api/cron/daily` reste donc dans `apps/console/vercel.json` ; les
# deux fréquences plus courtes sont déclenchées depuis GitHub Actions. ATTENTION :
# ce dépôt est PRIVÉ, donc ces exécutions consomment le quota de minutes Actions du
# compte — contrairement à ce que cette note affirmait jusqu'au 25/08/2026.
#
# CADENCE : HORAIRE, et c'est un arbitrage assumé. La cadence d'origine (*/5)
# faisait ~8 600 déclenchements par mois ; GitHub facture au job commencé, minute
# entamée, donc ~8 600 minutes contre 2 000 incluses sur un dépôt privé. Le quota
# du mois partait en une semaine, et c'est la CI qui tombait avec lui — plus aucun
# job ne recevait de runner à partir du 28/08. Deux exécutions horaires (~1 440
# minutes/mois) laissent de quoi faire tourner la CI.
#   Ce que ça coûte : la latence d'alerte passe de 5 à 60 minutes. Acceptable au
#   stade POC, pas au-delà.
#   Comment revenir à 5 minutes : passer l'hébergement sur Vercel Pro, qui
#   débloque les crons infra-journaliers — les trois entrées retournent alors
#   dans vercel.json et ce workflow disparaît (cf. C0.2 de CHANTIERS.md).
#
# LIMITES ASSUMÉES, à connaître avant de s'y fier :
#   • le cron GitHub est *best-effort* : les exécutions peuvent être décalées de
#     plusieurs minutes aux heures chargées, et le pas minimal est de 5 min ;
#   • GitHub DÉSACTIVE les workflows planifiés d'un dépôt resté 60 jours sans
#     activité (il faut alors les réactiver à la main) ;
#   • si ces deux points deviennent gênants, la vraie réponse est le plan Vercel
#     Pro, qui débloque les crons infra-journaliers : il suffit alors de remettre
#     les trois entrées dans `vercel.json` et de supprimer ce workflow.
#
# Les routes appelées sont idempotentes et protégées par `Authorization: Bearer
# $CRON_SECRET` — un déclenchement en double est sans conséquence.
name: Cron (tâches planifiées)

on:
  schedule:
    # à :35 — check_alerts, check_slo_burn, uptime, livraison webhooks.
    # Toute expression AUTRE que "5 * * * *" est traitée comme un tick (cf. le
    # script plus bas) : c'est la minute qui distingue les deux, pas la fréquence.
    - cron: "35 * * * *"
    # à :05 — rollups, nouvelles erreurs, anomalies IA
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Route à déclencher manuellement"
        required: true
        default: tick
        type: choice
        options: [tick, hourly, daily]

permissions: {}

concurrency:
  # une exécution à la fois : un tick lent ne doit pas s'empiler sur le suivant.
  group: cron-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ne tourne pas sur les forks (ils n'ont pas le secret, et l'appel
    # échouerait en 401 à chaque tick).
    #
    # ⚠ Cette garde nomme le dépôt en dur : elle doit être mise à jour à tout
    # renommage, sinon le job est sauté SILENCIEUSEMENT à chaque tick — aucune
    # exécution, aucune erreur, aucun signal. C'est exactement ce qui s'est
    # produit entre la migration Neon et le 25/08/2026 : la garde portait
    # encore `jt33120/mip-rum` alors que le dépôt est `jt33120/poc-MIP_RUM`,
    # et ni les alertes, ni les sondes uptime, ni les rollups horaires ne se
    # sont exécutés pendant toute cette période.
    if: github.repository == 'jt33120/poc-MIP_RUM'
    steps:
      - name: Appeler la route planifiée
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # surchargeable par une variable de dépôt si l'URL de la console change
          BASE_URL: ${{ vars.CONSOLE_BASE_URL || 'https://mip-rum-console.vercel.app' }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_JOB: ${{ github.event.inputs.job }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::secret CRON_SECRET absent — les routes /api/cron/* répondront 401." \
                 "L'ajouter dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          # workflow_dispatch fournit le job ; sinon on le déduit du schedule.
          if [ -n "${MANUAL_JOB:-}" ]; then
            JOB="$MANUAL_JOB"
          elif [ "$SCHEDULE" = "5 * * * *" ]; then
            JOB=hourly
          else
            JOB=tick
          fi
          echo "déclenchement de /api/cron/$JOB"

          # -f absent volontairement : on veut LIRE le corps même en erreur (les
          # routes renvoient le détail par étape, y compris en 207).
          code=$(curl -sS -o /tmp/out -w '%{http_code}' --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE_URL/api/cron/$JOB")
          echo "HTTP $code"
          cat /tmp/out
          echo

          case "$code" in
            200) echo "toutes les étapes ont réussi" ;;
            # 207 = échec partiel : une étape a échoué, les autres ont tourné.
            # On échoue le job pour que ce soit visible, sans masquer le détail.
            207) echo "::error::échec partiel — voir le détail par étape ci-dessus"; exit 1 ;;
            401|503) echo "::error::HTTP $code — CRON_SECRET manquant ou incorrect côté Vercel"; exit 1 ;;
            *)   echo "::error::HTTP $code inattendu"; exit 1 ;;
          esac
