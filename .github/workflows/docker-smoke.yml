# FUMÉE DES IMAGES DE SERVICE — une par service, en matrice (contrat de service § 10).
#
# Chaque service a SON image (`services/<x>/Dockerfile`) et SON profil compose
# (`infra/docker/docker-compose.yml`). Chaque ligne de la matrice construit
# l'image de production du service, la démarre avec ce dont elle dépend — et
# rien d'autre — puis vérifie :
#
#   1. la base est posée par le MIGRATEUR de production (service `migrate`,
#      `node services/scheduler/migrate.mjs`), sorti en 0 avant le service ;
#   2. `/health` rend 200 ;
#   3. une requête de référence, propre au service ;
#   4. le processus ne tourne pas en root ;
#   5. SIGTERM → sortie 0 en moins de 10 s (ce que Railway envoie à chaque
#      redéploiement, avant SIGKILL).
#
# Un service ajouté = une ligne de matrice, un profil compose et, au besoin, un
# bloc « référence ». `mcp` ne dépend ni de la base ni de `migrate` : c'est sa
# garantie centrale (aucun accès à Postgres), et la fumée la vérifie aussi.
#
# Les runners GitHub fournissent Docker ; la même preuve se rejoue sur un poste
# (infra/docker/README.md, « Fumée en local »).
name: Docker smoke (images de service)

on:
  pull_request:
    paths:
      - "infra/docker/**"
      - "services/**"
      - "packages/backend/**"
      - "packages/db/**"
      - "packages/mcp-tools/**"
      - "packages/service-kit/**"
      # Ce que les images lisent en dehors des paquets : le lockfile (pnpm
      # fetch), le workspace, la version de pnpm, le contexte de build, et les
      # deux scripts exécutés à la construction.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - "scripts/ci/deploy-fidele.mjs"
      - "scripts/fetch-geoip-db.mjs"
      - ".github/workflows/docker-smoke.yml"
  push:
    branches: [master]
    paths:
      - "infra/docker/**"
      - "services/**"
      - "packages/backend/**"
      - "packages/db/**"
      - "packages/mcp-tools/**"
      - "packages/service-kit/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - "scripts/ci/deploy-fidele.mjs"
      - "scripts/fetch-geoip-db.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumee:
    name: Fumée ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Chaque service a son verdict : un collecteur rouge ne doit pas masquer
      # l'état du scheduler.
      fail-fast: false
      matrix:
        include:
          # `port` : port publié sur l'hôte (défauts du compose).
          - service: collector
            port: 4318
          - service: scheduler
            port: 4320
          - service: mcp
            port: 4322
    env:
      # Le profil du service : `up` et `down` voient ainsi le même périmètre.
      COMPOSE_PROFILES: ${{ matrix.service }}
      IDENTITY_HASH_SECRET: docker-smoke-test-only-secret
      # Jeton de /ready et /metrics du scheduler (≥ 32 caractères) : sans lui,
      # les deux répondent 404 et la référence ne pourrait rien lire.
      METRICS_TOKEN: docker-smoke-metrics-token-only-for-ci
      # Le collecteur lit l'adresse sur la socket : c'est ce qui allume le
      # GeoIP, et permet de vérifier que la base est bien dans l'image.
      GEOIP_IP_SOURCE: socket
    defaults:
      run:
        working-directory: infra/docker
    steps:
      - uses: actions/checkout@v6

      # `up <service>` : le service et ses dépendances, rien d'autre. Pour
      # collector et scheduler : db → migrate (sorti en 0) → le service.
      # `--wait` rend la main quand la sonde de l'image dit « healthy ».
      - name: Construire et démarrer (${{ matrix.service }})
        run: docker compose up -d --build --wait --wait-timeout 300 "${{ matrix.service }}"

      - name: La base est posée par le migrateur
        if: matrix.service != 'mcp'
        run: |
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q migrate)")
          echo "migrate -> code de sortie $code"
          test "$code" = "0"
          # Journal capturé d'abord : un `grep -q` en bout de tube peut couper
          # l'écrivain (SIGPIPE), et `pipefail` en ferait un faux échec.
          docker compose logs --no-color migrate > /tmp/migrate.log
          grep '"msg":"migrations à jour"' /tmp/migrate.log

      - name: Aucune base pour mcp
        if: matrix.service == 'mcp'
        run: |
          # Ni conteneur `db` ni `migrate` : mcp ne doit rien attendre d'eux.
          if [ -n "$(docker compose ps -a -q db migrate)" ]; then
            echo "::error::mcp a démarré db ou migrate — il ne doit dépendre d'aucune base"
            exit 1
          fi
          # Ni `pg` dans l'arbre déployé : si le paquet réapparaît dans le graphe
          # de @mip/service-mcp, la garantie tombe sans que rien d'autre n'échoue.
          magasin=$(docker compose exec -T mcp ls /app/services/mcp/node_modules/.pnpm)
          if grep -q '^pg@' <<< "$magasin"; then
            echo "::error::pg est présent dans l'image MCP — ce service ne doit pas pouvoir joindre Postgres"
            exit 1
          fi
          echo "ni base ni pg — conforme"

      - name: /health -> 200
        run: |
          body=$(curl -fsS "http://localhost:${{ matrix.port }}/health")
          echo "GET /health -> $body"
          echo "$body" | grep -q '"status":"ok"'

      - name: "Référence collector : identité brute -> HMAC persisté, GeoIP embarqué"
        if: matrix.service == 'collector'
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"resourceSpans":[{"resource":{"attributes":[{"key":"mip.app_id","value":{"stringValue":"docker-smoke"}}]},"scopeSpans":[{"spans":[{"name":"rum.action","traceId":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","spanId":"bbbbbbbbbbbbbbbb","startTimeUnixNano":"1800000000000000000","endTimeUnixNano":"1800000000010000000","attributes":[{"key":"mip.session_id","value":{"stringValue":"docker-identity-session"}},{"key":"mip.event_type","value":{"stringValue":"action"}},{"key":"mip.event_name","value":{"stringValue":"checkout"}},{"key":"mip.action_id","value":{"stringValue":"docker-action"}},{"key":"mip.identity.user_id","value":{"stringValue":"raw-user-must-not-persist"}}]}]}]}]}' \
            "http://localhost:${{ matrix.port }}/v1/traces")
          echo "POST /v1/traces -> $code ($(cat /tmp/out))"
          test "$code" = "200"
          stored=$(docker compose exec -T db psql -U postgres -d mip_rum -tAc \
            "select user_id_hash ~ '^[0-9a-f]{64}$' from rum_session where session_id='docker-identity-session'")
          test "$stored" = "t"
          leaked=$(docker compose exec -T db psql -U postgres -d mip_rum -tAc \
            "select count(*) from rum_session where row_to_json(rum_session)::text like '%raw-user-must-not-persist%'")
          test "$leaked" = "0"
          # L'indexation de la base GeoIP ne bloque pas le démarrage : on laisse
          # passer l'état `chargement` avant de juger.
          for _ in $(seq 1 15); do
            health=$(curl -fsS "http://localhost:${{ matrix.port }}/health")
            if ! echo "$health" | grep -q '"etat":"chargement"'; then break; fi
            sleep 1
          done
          echo "$health" | grep -q '"identity_hash":{"configured":true}'
          # GeoIP : optionnel PAR CONTRAT (un db-ip.com indisponible donne une
          # image sans base, et c'est un avertissement). Une base PRÉSENTE dans
          # l'image mais non chargée, elle, est un défaut de l'image.
          if echo "$health" | grep -q '"etat":"actif"'; then
            echo "geoip actif : $(echo "$health" | grep -o '"version":"[^"]*"')"
          elif docker compose exec -T collector sh -c 'ls services/collector/node_modules/@mip/backend/data/*.csv.gz' >/dev/null 2>&1; then
            echo "::error::base GeoIP présente dans l'image mais non chargée : $health"
            exit 1
          else
            echo "::warning::image construite sans base GeoIP (téléchargement db-ip.com en échec ?) — la collecte fonctionne sans"
          fi

      - name: "Référence scheduler : un premier tick réussi"
        if: matrix.service == 'scheduler'
        run: |
          # Le worker lance un tick dès le démarrage ; /ready (sous jeton) en
          # garde le bilan local, `cadences.tick.local`. Pas de `curl -f` : /ready
          # rend 503 tant qu'une cadence est en retard, et c'est le CORPS qu'on juge.
          # Sans jeton : 404, pas 401 (le kit ne révèle pas que la route existe).
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${{ matrix.port }}/ready")
          echo "GET /ready sans jeton -> $code"
          test "$code" = "404"
          for _ in $(seq 1 20); do
            ready=$(curl -sS -H "authorization: Bearer $METRICS_TOKEN" "http://localhost:${{ matrix.port }}/ready")
            if echo "$ready" | jq -e '.cadences.tick.local != null' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          echo "GET /ready -> $ready"
          echo "$ready" | jq -e '.cadences.tick.local.statut == "fait"' >/dev/null

      - name: "Référence mcp : 401 sans jeton, 16 outils avec"
        if: matrix.service == 'mcp'
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "http://localhost:${{ matrix.port }}/mcp" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "sans jeton -> $code ($(cat /tmp/out))"
          test "$code" = "401"
          # Sans session : chaque POST est autonome, `tools/list` n'appelle pas
          # l'API — le test est complet sans console.
          curl -fsS -X POST "http://localhost:${{ matrix.port }}/mcp" \
            -H 'authorization: Bearer jeton-ci' \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > /tmp/tools.json
          # `tr` : le `wc` de macOS cadre le nombre à droite ; le rejeu local
          # de ce workflow doit rendre le même verdict que le runner.
          n=$(grep -o 'mip_rum_[a-z_]*' /tmp/tools.json | sort -u | wc -l | tr -d ' ')
          echo "outils exposés : $n"
          test "$n" = "16"

      - name: Non-root
        run: |
          uid=$(docker compose exec -T "${{ matrix.service }}" id -u)
          echo "uid = $uid"
          test "$uid" != "0"

      - name: SIGTERM -> sortie 0 en moins de 10 s
        run: |
          # `stop -t 10` : SIGTERM, puis SIGKILL au bout de 10 s. Un code 0
          # prouve que le processus est sorti de lui-même, avant le SIGKILL
          # (qui rendrait 137).
          debut=$(date +%s)
          docker compose stop -t 10 "${{ matrix.service }}"
          duree=$(( $(date +%s) - debut ))
          code=$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q "${{ matrix.service }}")")
          echo "arrêt en ${duree} s, code de sortie $code"
          test "$code" = "0"
          test "$duree" -lt 10

      - name: Logs conteneurs (si échec)
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v
