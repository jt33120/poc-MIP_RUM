# CI MIP RUM — build SDK + tests unitaires, puis E2E Playwright sur Postgres de service.
# Reproduit le flux local : schéma par le migrateur (schema.sql puis toutes les
# migrations) -> seed synthétique -> playwright (qui lance lui-même dev-server
# :4318, démo :8080, console :3000 via webServer).
name: CI

# PLUS DE FILTRE PAR CHEMIN, ET C'EST DÉLIBÉRÉ. Le `paths-ignore` d'avant sautait
# la CI sur `docs/**`, `**.md` et l'outillage de planification, pour économiser
# ~3 min par commit de documentation. Deux choses l'ont rendu dangereux :
#   - `_bmad-output/**`, `_bmad/**` et `.claude/**` ne sont plus dans le dépôt ;
#   - `docs/RUM_PARITY_STATUS.md` n'est plus un document inerte : il est analysé
#     par `scripts/couverture-extraire.mjs`, figé dans
#     `apps/console/lib/couverture.generated.json`, gardé par
#     `tests/unit/couverture-site.test.ts` et AFFICHÉ par `/presentation`.
# Une PR « de documentation seule » pouvait donc casser la vitrine publique sans
# qu'aucun test ne tourne. Le miroir Vercel ("ignoreCommand") est retiré pour la
# même raison : ce commit de doc-là doit redéployer.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build SDK + tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # version pnpm lue depuis "packageManager" (pnpm@9.15.9) du package.json racine
      - uses: pnpm/action-setup@v6

      # UN SEUL RUNTIME, LU DANS `.nvmrc` (P1). La CI testait sous Node 26 alors
      # que les images Railway tournaient sous Node 22 et la console Vercel sous
      # Node 24 (« nodeVersion: 24.x » du projet) : trois versions, et aucun test
      # ne tournait sur celle de la production. Tous les jobs lisent désormais le
      # même fichier que `engines.node` du package.json racine et que le `FROM`
      # des images — changer de version, c'est changer ces trois lignes ensemble.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile gelé)
        run: pnpm install --frozen-lockfile

      # P7.1 — un seul point d'entrée pour les paquets SDK. Le suffixe `...` du
      # filtre pnpm entraîne les DÉPENDANCES : `@mip/rum-core` est construit
      # avant les runtimes qui l'inlinent, sans que personne ait à connaître
      # l'ordre. La console (`next build`) reste au job E2E.
      - name: Build des SDK (cœur partagé, web + budget taille, React Native, agent Node)
        run: pnpm build:sdk

      # Empêche l'extension d'expédier un SDK périmé (vendor/mip-rum.js) ou une
      # version de manifest qui dérive du SDK. Nécessite le build SDK ci-dessus.
      - name: Extension — synchro bundle & version
        run: node apps/extension/scripts/check-sync.mjs

      # P7.1 — étanchéité des bundles (web sans RN, RN sans DOM, Node sans React)
      # et installation des paquets CONSTRUITS dans un consommateur isolé : ce que
      # `exports` publie réellement, en CJS, en ESM et en types.
      - name: Empaquetage SDK — étanchéité et mini-consommateur
        run: node scripts/verify-sdk-packaging.mjs

      # P8.8 — le typage des paquets publiés n'était joué NULLE PART : le SDK web a
      # compilé faux pendant plusieurs lots sans qu'aucun contrôle ne rougisse, et
      # seul un lancement manuel l'a révélé. Un type faux ne casse pas le bundle
      # esbuild, qui efface les types — il casse l'application cliente qui l'importe.
      #
      # P1 — l'extension y entre (R9, `F2` de docs/RUM_PARITY_STATUS.md) : écrite en
      # TypeScript, elle n'était typée par AUCUN workflow — verte à la main le
      # 23/09, rien ne le garantissait à sa modification suivante.
      # Reste HORS typage, et c'est connu : le JavaScript du backend
      # (`packages/backend`, `packages/db`, `packages/mcp-tools`, `services/*`),
      # en `.mjs` sans tsconfig ni `checkJs`. Ses JSDoc ne sont vérifiés par rien.
      - name: Typage des paquets publiés et de l'extension
        run: |
          pnpm --filter @mip/rum-core exec tsc --noEmit
          pnpm --filter @mip/rum-sdk exec tsc --noEmit
          pnpm --filter @mip/rum-mobile exec tsc --noEmit
          pnpm --filter @mip/agent-node exec tsc --noEmit
          pnpm --filter console typecheck
          pnpm --filter extension typecheck

      - name: Tests unitaires (vitest)
        run: pnpm test:unit

      # v0.4 — middleware FastAPI de tracing (stdlib pur : aucun pip install requis)
      - name: Tests middleware Python (unittest)
        run: python3 -m unittest discover -s examples/integrations/fastapi -v

  # R9 — CONSTRUIRE LE DÉPÔT COMME UN NOUVEL ARRIVANT LE FERAIT.
  #
  # `pnpm -r build` (le script racine `build`) échouait sur un dépôt fraîchement
  # installé : `apps/extension` copie `packages/rum-sdk/dist/mip-rum.js` sans
  # déclarer de dépendance vers `@mip/rum-sdk`, donc pnpm n'avait aucune raison
  # de construire le SDK d'abord (`ENOENT … rum-sdk/dist/mip-rum.js`, § 8.3 de
  # docs/RUM_PARITY_STATUS.md). Le job `unit` ne pouvait pas le voir : il appelle
  # `pnpm build:sdk` AVANT tout le reste, et masquait ainsi l'ordre manquant.
  # La dépendance est désormais déclarée (`apps/extension/package.json`) ; ce
  # job garde la correction en jouant la séquence d'un clone neuf, SANS
  # `pnpm build:sdk` préalable — l'ajouter ici annulerait le job.
  build-propre:
    name: Construction depuis un dépôt propre
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile gelé)
        run: pnpm install --frozen-lockfile

      - name: pnpm -r build, sans build:sdk préalable
        run: pnpm -r build

      # Une construction propre doit REPRODUIRE ce qui est versionné, pas le
      # réécrire : `apps/extension/vendor/` est committé (l'extension se charge
      # « unpacked »), et la console sert des copies du SDK depuis `public/`.
      # Un fichier modifié ici est un artefact committé qui dérive de sa source.
      - name: Rien de versionné n'a changé
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::pnpm -r build a modifié des fichiers versionnés : un artefact committé dérive de sa source"
            exit 1
          fi

  e2e:
    name: E2E Playwright (Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # même URL que les défauts locaux (dev-server, tests, console) : host 5433 -> conteneur 5432
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum
    services:
      # POSTGRES 17, LA VERSION DE PRODUCTION (Neon, 17.11 au 23/09/2026). La CI
      # tournait sous 15 : ce que 16 et 17 ont changé au planificateur et au
      # moteur n'y était pas exercé, et une migration « rejouable de 15 à 17 »
      # n'était prouvée que sur la plus ancienne des deux bornes. L'étiquette
      # majeure suffit : c'est le moteur qu'on aligne, pas le correctif mineur.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mip_rum
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d mip_rum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # Même runtime que le job `unit` : `.nvmrc` (Node 24).
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (lockfile gelé)
        run: pnpm install --frozen-lockfile

      # P1 — LE SCHÉMA SE MONTE PAR LE MIGRATEUR DE PRODUCTION, plus par une
      # boucle psql. La boucle prouvait que les FICHIERS s'enchaînent ; elle ne
      # prouvait rien du programme qui les applique réellement au pré-déploiement
      # du scheduler (`services/scheduler/migrate.mjs` → `main()` de
      # `@mip/db/migrate.mjs`) : son ordre, son registre `schema_migration`, sa
      # transaction par fichier. Une base vierge exerce tout cela d'un coup.
      #
      # DEUX PASSAGES, et le second doit n'avoir RIEN à faire. Un fichier que le
      # registre oublierait, ou dont l'empreinte changerait d'un passage à l'autre,
      # serait rejoué à CHAQUE déploiement de production. On l'exige deux fois :
      # le migrateur doit le DIRE (« migrations à jour », 0 appliquée) et le
      # registre ne doit pas avoir bougé.
      #
      # console_ro (cloud) absent en CI -> blocs grant/RLS sautés par leur garde
      # `if exists (pg_roles)`.
      - name: Schéma par le migrateur (deux passages, le second à vide)
        env:
          PGPASSWORD: postgres
        run: |
          node services/scheduler/migrate.mjs
          avant=$(psql -h localhost -p 5433 -U postgres -d mip_rum -tAc 'select count(*) from schema_migration')
          echo "premier passage : $avant fichiers au registre"

          # Sortie capturée pour être relue ; `if !` pour l'afficher AUSSI quand
          # le passage échoue (le shell par défaut s'arrêterait sans la montrer).
          if ! node services/scheduler/migrate.mjs > /tmp/migrate-2.log 2>&1; then
            cat /tmp/migrate-2.log
            echo "::error::le second passage du migrateur a échoué"
            exit 1
          fi
          cat /tmp/migrate-2.log
          apres=$(psql -h localhost -p 5433 -U postgres -d mip_rum -tAc 'select count(*) from schema_migration')

          # Ce que le migrateur DIT : sa dernière ligne « migrations à jour ».
          # (Les `${…}` ci-dessous sont des gabarits JavaScript, pas du shell.)
          # shellcheck disable=SC2016
          node -e '
            const lignes = require("node:fs").readFileSync("/tmp/migrate-2.log", "utf8").split("\n");
            const bilans = lignes.flatMap((l) => { try { return [JSON.parse(l)]; } catch { return []; } })
              .filter((j) => j.msg === "migrations à jour");
            const bilan = bilans.at(-1);
            if (!bilan) { console.error("::error::second passage : aucune ligne « migrations à jour »"); process.exit(1); }
            if (bilan.appliquees !== 0) {
              console.error(`::error::second passage : ${bilan.appliquees} migration(s) en attente au lieu de 0`);
              process.exit(1);
            }
            console.log("second passage : 0 en attente");
          '
          # Ce que le REGISTRE montre, indépendamment du format des journaux.
          if [ "$avant" != "$apres" ]; then
            echo "::error::le registre est passé de $avant à $apres fichiers au second passage"
            exit 1
          fi

      # E1-S3 — une isolation non testée n'est pas une isolation. Le script rejoue
      # le schéma sur une base DÉDIÉE (ne perturbe ni le seed ni l'E2E), se met dans
      # la peau du rôle applicatif console_ro et vérifie qu'un tenant ne lit jamais
      # l'autre SANS aucun `WHERE app_id =` dans les requêtes. Placé après les
      # migrations de mip_rum pour que la création du rôle console_ro ne modifie pas
      # le comportement des blocs `if exists (pg_roles)` de la base principale.
      - name: Isolation multi-tenant (RLS, base dédiée)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_rls'
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mip_rum_rls \
            pnpm test:isolation

      # P4 — vérifie sur PostgreSQL réel le comptage event:<nom>, son isolation
      # tenant, la baseline zero-filled et les index de l'Explorer.
      - name: Alerting événements custom (base dédiée)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_alerting'
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mip_rum_alerting \
            pnpm test:alerting

      # SVI I0 — le modèle d'appel porte les propriétés dont dépendent tous les
      # taux affichés (containment, abandon, transfert) : écriture désordonnée,
      # rejeu idempotent, issue non inventable, saisie sensible sans longueur.
      # Base dédiée, comme le test d'isolation.
      - name: Modèle d'appel SVI (base dédiée)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_svi'
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/mip_rum_svi \
            pnpm test:svi

      # P0 safety/truth : le test applique le schéma+migrations dans sa base
      # jetable. SQL_TEST_DATABASE_URL interdit le skip silencieux local/CI.
      # SQL_TEST_V68_DATABASE_URL : base des fenêtres de déploiement, remise à zéro
      # par chaque suite qui l'utilise — code P5.1 sur un schéma v68 avant
      # migration-v69, code P5.3 sur un schéma v69 avant migration-v70.
      # SQL_TEST_PRE_V71_DATABASE_URL : fenêtre de déploiement P5.4, code écrit sur
      # un schéma sans migration-v71 avant de l'y appliquer.
      # SQL_TEST_PRE_V81_DATABASE_URL : fenêtre de déploiement P8.1, code écrit sur
      # un schéma v80 — sans table de barrières — avant de l'y appliquer.
      # SQL_TEST_PRE_V83_DATABASE_URL : fenêtre de déploiement P8.2, code écrit sur
      # un schéma v82 — sans le journal de reprise — avant de l'y appliquer. Elle
      # manquait : la suite se skippait donc en silence, et un vrai échec (le cache
      # de colonnes de pg-ingest, indexé par table et non par base) est resté
      # invisible jusqu'à ce que v85 le révèle.
      # SQL_TEST_PRE_V85_DATABASE_URL : fenêtre de déploiement P8.7, code écrit sur
      # un schéma v83 — sans les colonnes de provenance du pays — avant de l'y
      # appliquer. Sans elle, la suite se SKIPPE en silence, ce qui reviendrait à
      # ne pas tester la fenêtre du tout.
      # SQL_TEST_PRE_V86_DATABASE_URL : fenêtre de déploiement B52, tick du
      # scheduler et dispatcher en service sur un schéma v85 — sans le mode release
      # de check_alerts — avant et après l'application de migration-v86.
      - name: P0 safety and truth SQL (base dédiée)
        env:
          PGPASSWORD: postgres
          SQL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_p0
          SQL_TEST_V65_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_v65
          SQL_TEST_V68_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_v68
          SQL_TEST_PRE_V71_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_pre_v71
          SQL_TEST_PRE_V81_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_pre_v81
          SQL_TEST_PRE_V83_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_pre_v83
          SQL_TEST_PRE_V85_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_pre_v85
          SQL_TEST_PRE_V86_DATABASE_URL: postgres://postgres:postgres@localhost:5433/mip_rum_pre_v86
        run: |
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_p0'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_v65'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_v68'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_pre_v71'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_pre_v81'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_pre_v83'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_pre_v85'
          psql -h localhost -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'create database mip_rum_pre_v86'
          pnpm test:sql

      # `...` entraîne `@mip/rum-core`, dont le SDK web inline les primitives.
      - name: Build SDK (servi par demo/serve.mjs et la console)
        run: pnpm --filter "@mip/rum-sdk..." build

      # le test corrélation attend des runs robot en face des données RUM générées par le test
      - name: Seed synthétique (app demo-app, 24 h de runs)
        run: node tools/sync-synthetic/src/sync.mjs seed

      # v0.4 — backend FastAPI de démo (cible du tracing distribué, spawné par l'E2E)
      - name: Dépendances Python du backend démo
        run: pip3 install fastapi uvicorn

      - name: Installer Chromium (+ dépendances système)
        run: pnpm exec playwright install chromium --with-deps

      # playwright.config.ts lance/attend les 3 serveurs (collecteur de dev :4318, démo :8080, console :3000)
      - name: Tests E2E
        run: pnpm exec playwright test

      - name: Artefacts de débogage (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
