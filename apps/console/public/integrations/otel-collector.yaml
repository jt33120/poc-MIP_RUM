# otel-collector.yaml — Collector OpenTelemetry (open source) devant la collecte MIP.
#
# FACULTATIF. La voie ordinaire : l'agent OpenTelemetry officiel du langage du
# serveur exporte directement vers la collecte MIP (socle de variables OTEL_*
# donné par l'assistant d'intégration de la console). Ce Collector sert quand le
# serveur ne peut pas sortir vers Internet, ou quand on veut filtrer avant
# l'envoi : les agents le visent alors (http://127.0.0.1:4318), et c'est lui qui
# porte l'identité MIP et réémet vers la collecte.
#
# 1. Remplacer les quatre <…> ci-dessous :
#    <APP_ID>         : l'app_id de l'application (identique à la console)
#    <API_KEY>        : la clé d'API affichée à la création de l'application
#    <ADRESSE_TRACES> : l'adresse complète des traces (…/api/ingest/v1/traces)
#    <ADRESSE_LOGS>   : l'adresse complète des journaux (…/api/ingest/v1/logs)
# 2. Lancer le Collector :
#    docker run -p 4318:4318 -p 4317:4317 \
#      -v $(pwd)/otel-collector.yaml:/etc/otelcol-contrib/config.yaml \
#      otel/opentelemetry-collector-contrib:latest

receivers:
  otlp:
    protocols:
      http: {}
      grpc: {}

processors:
  # Choix de volume, à retirer pour tout envoyer : ne garder qu'un span par
  # requête entrante, le span SERVER. Les spans client et internes du serveur
  # (requêtes à la base, appels sortants) restent alors chez le client.
  filter/server_only:
    error_mode: ignore
    traces:
      span:
        - 'kind != SPAN_KIND_SERVER'

  # Identité MIP injectée côté Collector : l'application du client n'a rien de
  # spécifique à MIP dans sa configuration.
  resource:
    attributes:
      - key: mip.app_id
        value: "<APP_ID>"
        action: upsert
      - key: mip.api_key
        value: "<API_KEY>"
        action: upsert

  batch: {}

exporters:
  otlphttp/mip:
    # Adresses exactes : rien n'y est ajouté quand elles sont propres au signal.
    traces_endpoint: "<ADRESSE_TRACES>"
    logs_endpoint: "<ADRESSE_LOGS>"
    encoding: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/server_only, resource, batch]
      exporters: [otlphttp/mip]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [otlphttp/mip]
