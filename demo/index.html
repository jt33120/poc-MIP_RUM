<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Démo MIP RUM — mini-site</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; }
    h1 { font-size: 2.6rem; }
    button { margin: 0.3rem; padding: 0.6rem 1rem; cursor: pointer; }
    #view { padding: 1rem; border: 1px solid #ccc; border-radius: 8px; min-height: 80px; }
  </style>
  <script src="/mip-rum.js"></script>
  <script>
    // ?requireConsent=1 -> consent mode (validation A1 : 0 requête sans consent(true))
    MIPRum.init({
      endpoint: "http://localhost:4318/v1/traces",
      appId: "demo-app",
      clientId: "mip-demo",
      env: "dev",
      apiKey: "demo-key-local",
      sampleRate: 1.0,
      flushIntervalMs: 2000,
      slowResourceMs: 300,
      requireConsent: new URLSearchParams(location.search).has("requireConsent"),
      // v0.3 — session replay (bundle séparé lazy-loadé ; receveur local :4319)
      replay: true,
      replayEndpoint: "http://localhost:4319/v1/replay",
    });
  </script>
</head>
<body>
  <h1>G-IT — Plateforme Partenaires (démo MIP RUM)</h1>
  <p>Mini-site de test du SDK RUM : Web Vitals, erreurs JS et navigation SPA.</p>

  <div>
    <button id="btn-error">Provoquer une erreur JS</button>
    <button id="btn-rejection">Promesse rejetée</button>
    <button id="btn-nav-list">→ /partners</button>
    <button id="btn-nav-detail">→ /partners/42</button>
    <button id="btn-slow-res">Ressource lente</button>
    <button id="btn-longtask">Long task</button>
    <button id="btn-track">Événement métier</button>
  </div>

  <div id="view">Accueil</div>

  <!-- v0.3 — démo masquage replay : la saisie apparaît en *** dans le player
       (maskAllInputs), le bloc .mip-rum-block n'est pas enregistré du tout -->
  <p style="margin-top:1rem">
    <label>Champ masqué dans le replay :
      <input id="input-masked" type="text" placeholder="tapez un secret…" />
    </label>
  </p>
  <p class="mip-rum-block" style="background:#fee2e2;padding:0.5rem">
    Bloc exclu du replay (classe <code>mip-rum-block</code>) — ex. données patient/IBAN.
  </p>

  <script>
    // layout shift volontaire (~600 ms après le load, hors interaction) -> CLS réel mesurable
    setTimeout(() => {
      const banner = document.createElement("div");
      banner.textContent = "⚠️ Bandeau injecté tardivement (layout shift volontaire pour la démo CLS)";
      banner.style.cssText = "padding:1.5rem;background:#fde68a;margin-bottom:1rem;";
      document.body.prepend(banner);
    }, 600);

    // simulated SPA: History API navigation, content swap
    function render(route) {
      document.getElementById("view").textContent = "Vue : " + route;
    }
    document.getElementById("btn-error").addEventListener("click", () => {
      throw new Error("Erreur de démo MIP RUM");
    });
    document.getElementById("btn-rejection").addEventListener("click", () => {
      Promise.reject(new Error("Rejet de promesse de démo"));
    });
    document.getElementById("btn-nav-list").addEventListener("click", () => {
      history.pushState({}, "", "/partners");
      render("/partners");
    });
    document.getElementById("btn-nav-detail").addEventListener("click", () => {
      history.pushState({}, "", "/partners/42");
      render("/partners/42");
    });
    // v0.2 — ressource lente (servie par serve.mjs avec un sleep 800 ms)
    document.getElementById("btn-slow-res").addEventListener("click", () => {
      fetch("/slow")
        .then((r) => r.json())
        .then((j) => render("ressource lente chargée (" + j.delayMs + " ms)"));
    });
    // v0.2 — long task : boucle bloquante ~300 ms sur le main thread
    document.getElementById("btn-longtask").addEventListener("click", () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 300) { /* blocage volontaire */ }
      render("long task ~300 ms exécutée");
    });
    // v0.2 — événement métier persisté (rum_event) + breadcrumb custom
    document.getElementById("btn-track").addEventListener("click", () => {
      MIPRum.track("partner_search", { results: 12 });
      render("événement partner_search envoyé");
    });
  </script>
</body>
</html>
