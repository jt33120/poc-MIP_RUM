# ClickHouse local — bench B4 (chemin prod prouvé en local).
# Dernière LTS (26.3, releases .3/.8 = LTS). Volume éphémère (tmpfs) : rien ne survit au down.
# Usage : docker compose -f docker-compose.clickhouse.yml up -d
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    container_name: mip-rum-ch
    ports:
      - "8123:8123" # HTTP interface (writer + bench + console)
    environment:
      CLICKHOUSE_DB: mip_rum
      # user 'default' sans mot de passe — local uniquement
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    tmpfs:
      - /var/lib/clickhouse # éphémère : données perdues au down (voulu pour le bench)
    healthcheck:
      # 127.0.0.1 explicite : 'localhost' résout en ::1 dans le conteneur alors que CH écoute en IPv4
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30
