# POC « logs réseau » — stack Docker souveraine pour se faire la main :
#   loadgen (syslog) ─┐
#   (OTLP externe)  ──┤→ otel-collector ─┬→ clickhouse  ─ grafana (datasource CH)
#                     │                   └→ opensearch  ─ opensearch-dashboards
# Zéro donnée sensible : le loadgen fabrique des logs firewall synthétiques.
# Versions ÉPINGLÉES (repro + configs alignées). Cf. README.md.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (pour pousser des logs cloud/app de l'extérieur)
      - "4318:4318"   # OTLP HTTP
      - "54526:54526/udp"  # syslog RFC5424 (équipements réseau)
    depends_on:
      clickhouse:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports:
      - "8123:8123"   # HTTP (clients / Grafana peut aussi l'utiliser)
      - "9000:9000"   # protocole natif (exporter + grafana clickhouse)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ch-data:/var/lib/clickhouse

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"     # POC uniquement (jamais en prod)
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - os-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"   # UI OpenSearch
    depends_on:
      opensearch:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource 4.4.0"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3001:3000"   # UI ClickHouse (Grafana)
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  loadgen:
    image: alpine:3.20
    depends_on:
      - otel-collector
    environment:
      # Interpolation (pas une valeur figée) : sinon `RATE=500 docker compose up`
      # serait ignoré (une valeur littérale dans environment: prime sur l'env hôte).
      RATE: "${RATE:-50}"        # logs/seconde — surchargeable pour le test de sizing
      TARGET: "otel-collector"
      PORT: "54526"
    volumes:
      - ./loadgen/gen.sh:/gen.sh:ro
    command: ["sh", "-c", "apk add --no-cache bash >/dev/null && bash /gen.sh"]

volumes:
  ch-data:
  os-data:
